## Build the Vite app + generate index.html SPA shell via SSR
[build]
  command = "npm run build:netlify"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

## Proxy TanStack Start server function calls to backend (EC2)
## Replace with your actual backend domain after EC2 setup.
[[redirects]]
  from = "/_server/*"
  to = "http://13.201.222.133/_server/:splat"
  status = 200
  force = true

## SPA fallback for all frontend routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200