## Build this Vite app and publish static client files
[build]
  command = "npm run build"
  publish = "dist/client"

## Proxy TanStack Start server function calls to backend (EC2)
## Replace with your actual backend domain after EC2 setup.
[[redirects]]
  from = "/_server/*"
  to = "http://13.201.222.133/_server/:splat"
  status = 200
  force = true

## SPA fallback for all frontend routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200